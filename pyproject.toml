[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personakit"
version = "0.2.0"
description = "Evidence-based, behaviour-first personas as versioned Markdown files – with JTBD block, lint rules and prompt export."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hayal Özkan" }]
keywords = ["personas", "jtbd", "jobs-to-be-done", "ux", "llm", "prompting", "markdown"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "ruamel.yaml>=0.18",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
personakit = "personakit.cli:main"

[project.urls]
Repository = "https://github.com/malkreide/personakit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personakit = ["schema/*.json", "templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
